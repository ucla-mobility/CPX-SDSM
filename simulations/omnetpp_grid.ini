include omnetpp.ini

# 2x2 grid: path-loss exponent alpha x vehicle count. Periodic 10 Hz, 60 s, seed 0,
# 20 dBm. alpha=2.75 uses the base config.xml; alpha=2.0 uses config_alpha2.xml.
# n=10 uses scenario_n10.sumo.cfg; n=400 uses the base scenario.sumo.cfg.

[Config grid_a275_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_n10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.logPrefix = "grid_a275_n10"
output-scalar-file = grid_a275_n10.sca

[Config grid_a275_n400]
extends = Periodic
*.node[*].appl.logPrefix = "grid_a275_n400"
output-scalar-file = grid_a275_n400.sca

[Config grid_a20_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_n10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].nic.phy80211p.analogueModels = xmldoc("config_alpha2.xml")
*.node[*].nic.phy80211p.decider       = xmldoc("config_alpha2.xml")
*.node[*].appl.logPrefix = "grid_a20_n10"
output-scalar-file = grid_a20_n10.sca

[Config grid_a20_n400]
extends = Periodic
*.node[*].nic.phy80211p.analogueModels = xmldoc("config_alpha2.xml")
*.node[*].nic.phy80211p.decider       = xmldoc("config_alpha2.xml")
*.node[*].appl.logPrefix = "grid_a20_n400"
output-scalar-file = grid_a20_n400.sca
