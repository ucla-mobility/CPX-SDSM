include omnetpp.ini

# Combined validation 2x2 (policy x power) on the FULL 400-vehicle congested
# scenario, 150 s. repeat = 4 makes runs 0..3 exist so -r 0/1/2/3 select distinct
# seeds (seed-set = ${runnumber}); CSVs are suffixed -r0..-r3 per seed.
#   policy in {Periodic, HybridSDSM_v2}  x  power in {20 dBm/100mW, 30 dBm/1W}

[Config combo_per_p20]
extends = Periodic
repeat = 4
*.node[*].nic.mac1609_4.txPower = 100mW
*.node[*].appl.logPrefix = "combo_per_p20"
output-scalar-file = combo_per_p20.sca

[Config combo_hyb_p20]
extends = HybridSDSM_v2
repeat = 4
*.node[*].nic.mac1609_4.txPower = 100mW
*.node[*].appl.logPrefix = "combo_hyb_p20"
output-scalar-file = combo_hyb_p20.sca

[Config combo_per_p30]
extends = Periodic
repeat = 4
*.node[*].nic.mac1609_4.txPower = 1000mW
*.node[*].appl.logPrefix = "combo_per_p30"
output-scalar-file = combo_per_p30.sca

[Config combo_hyb_p30]
extends = HybridSDSM_v2
repeat = 4
*.node[*].nic.mac1609_4.txPower = 1000mW
*.node[*].appl.logPrefix = "combo_hyb_p30"
output-scalar-file = combo_hyb_p30.sca
