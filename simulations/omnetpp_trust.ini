include omnetpp.ini

# trust_sdsm_v2: validation scenarios for the SDSM trust layer
# (ros2_ws/src/sdsm_trust_perception -- second-layer, receiver-side trust
# judgment on SDSM traffic; see README.md's "SDSM trust layer" section).
#
# These extend Periodic on the small n10 density (sumo/scenario_d10.sumo.cfg,
# same fast-departure routes the PDR-investigation final study uses) and turn
# on rosBridgeMode="log" by default, since the whole point of these configs
# is producing a *-ros-events.jsonl file for analysis/replay_trust_verdicts.py
# to judge afterward. Everything below positionNoiseStdDev/attackerFraction is
# 0/off unless a config sets it -- trust_clean_n10 is the honest-data control.

[Config trust_clean_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_d10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.rosBridgeMode = "log"
*.node[*].appl.logPrefix = "trust_clean_n10"

[Config trust_noise_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_d10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.rosBridgeMode = "log"
*.node[*].appl.positionNoiseStdDev = 0.5m
*.node[*].appl.logPrefix = "trust_noise_n10"

[Config trust_phantom_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_d10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.rosBridgeMode = "log"
*.node[*].appl.attackerFraction = 0.2
*.node[*].appl.attackType = "phantom"
*.node[*].appl.logPrefix = "trust_phantom_n10"

[Config trust_spoof_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_d10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.rosBridgeMode = "log"
*.node[*].appl.attackerFraction = 0.2
*.node[*].appl.attackType = "spoof"
*.node[*].appl.logPrefix = "trust_spoof_n10"
