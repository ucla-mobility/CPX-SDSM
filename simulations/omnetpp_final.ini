include omnetpp.ini

# FINAL summary: UCLA map, alpha=2.0, vehicle count {10,150,400} x strategy
# {Periodic, HybridSDSM_v2}. 6 groups x 20 seeds. repeat=20 makes seeds 0..19 valid
# (seed-set = ${runnumber}); maxInterfDist widened so alpha=2.0 links are not clipped.

# ---- Periodic ----
[Config per_n10]
extends = Periodic
repeat = 20
*.connectionManager.maxInterfDist = 2000m
*.node[*].nic.phy80211p.analogueModels = xmldoc("config_alpha2.xml")
*.node[*].nic.phy80211p.decider       = xmldoc("config_alpha2.xml")
*.manager.commandLine = "sumo -c ../sumo/scenario_d10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.logPrefix = "per_n10"
output-scalar-file = per_n10.sca

