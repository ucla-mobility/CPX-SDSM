include omnetpp.ini

# Power/MCS sweep on the SPARSE 150-vehicle scenario (isolates the link-budget
# range limit from congestion). Each config extends Periodic (fixed 10 Hz) and
# overrides only txPower / bitrate, so the wall location is the dependent variable.

[Config SweepBase]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_sparse.sumo.cfg --remote-port $port --start --quit-on-end"

[Config sw_p20_b6]
extends = SweepBase
*.node[*].nic.mac1609_4.txPower = 100mW
*.node[*].nic.mac1609_4.bitrate = 6Mbps
*.node[*].appl.logPrefix = "sw_p20_b6"
output-scalar-file = sw_p20_b6.sca

