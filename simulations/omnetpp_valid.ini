include omnetpp.ini

# Validation experiments. Periodic (10 Hz), 150 s, seed 0, 20 dBm, 6 Mbps.
# Baselines are reused from earlier runs:
#   density n=400 -> combo_per_p20 ; path-loss alpha=2.75 (150 veh) -> sw_p20_b6

# --- Exp 1 (congestion): sparse 10-vehicle scenario (vs 400-veh baseline) ---
[Config valid_n10]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_n10.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.logPrefix = "valid_n10"
output-scalar-file = valid_n10.sca

# --- Exp 2 (path loss): alpha = 2.0 on the sparse 150-veh scenario ---
# (baseline alpha = 2.75 / 150 veh = sw_p20_b6). Isolates path-loss exponent.
[Config valid_a200]
extends = Periodic
*.manager.commandLine = "sumo -c ../sumo/scenario_sparse.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].nic.phy80211p.analogueModels = xmldoc("config_alpha2.xml")
*.node[*].nic.phy80211p.decider       = xmldoc("config_alpha2.xml")
*.node[*].appl.logPrefix = "valid_a200"
output-scalar-file = valid_a200.sca
