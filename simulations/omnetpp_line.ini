include omnetpp.ini

# Idealized controlled scenario: a straight 2 km road, vehicles STATIONARY and
# equally spaced, Periodic 10 Hz with random per-vehicle phase. Variable = density
# (vehicles per km). Free-space alpha=2.0 so the signal spans the whole 2 km, and a
# widened playground + interference range for the long road.

[Config LineBase]
extends = Periodic
*.node[*].nic.phy80211p.analogueModels = xmldoc("config_alpha2.xml")
*.node[*].nic.phy80211p.decider       = xmldoc("config_alpha2.xml")
*.world.playgroundSizeX = 2100m
*.world.playgroundSizeY = 100m
*.connectionManager.maxInterfDist = 2500m

[Config line_s500]
extends = LineBase
*.manager.commandLine = "sumo -c ../sumo/line/scenario_line_s500.sumo.cfg --remote-port $port --start --quit-on-end"
*.node[*].appl.logPrefix = "line_s500"
output-scalar-file = line_s500.sca

